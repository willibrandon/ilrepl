<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ilrepl in the browser</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #121218; }
    #session-status { font: 12px ui-monospace, monospace; color: #8c8ca0; padding: 0.5rem; }
    #session-files { display: flex; flex-wrap: wrap; gap: 0.5rem; padding: 0.5rem; color: #e0e0e0; font: 14px sans-serif; }
    #session-files button { padding: 0.3rem 0.6rem; background: #242430; color: inherit; border: 1px solid #505060; }
    #session-file-message { align-self: center; }
  </style>
</head>
<body>
  <div id="session-files" role="group" aria-label="Session controls"></div>
  <div id="session-status">Loading</div>
  <div id="terminal"></div>
  <script src="main.js"></script>
</body>
</html>
