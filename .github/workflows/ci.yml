name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            artifact: linux-x64
          - name: Linux Arm64
            os: ubuntu-24.04-arm
            artifact: linux-arm64
          - name: Windows x64
            os: windows-latest
            artifact: windows-x64
          - name: Windows Arm64
            os: windows-11-arm
            artifact: windows-arm64
          - name: macOS Arm64
            os: macos-26
            artifact: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.400'

      - name: Restore solution workloads
        run: dotnet workload restore

      - name: Test
        run: dotnet test --report-trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.artifact }}
          path: TestResults/

  test-musl:
    name: tests (Alpine ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: ubuntu-latest
          - arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Run the complete suite on Alpine
        run: >-
          docker run --rm
          -v "$PWD:/repo" -w /repo
          mcr.microsoft.com/dotnet/sdk:10.0.400-alpine3.23
          sh -c 'apk add --no-cache icu-libs libstdc++ &&
          dotnet workload restore &&
          dotnet test --report-trx --results-directory TestResults'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-linux-musl-${{ matrix.arch }}
          path: TestResults/

  native-aot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.400'

      - name: Publish, smoke test, and pack for linux-x64
        run: dotnet run --file scripts/Publish-NativeAot.cs -- --rid linux-x64 --package-version 0.0.0-ci
