name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.302'

      - name: Install the wasm-tools workload
        run: dotnet workload install wasm-tools --skip-manifest-update

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test tests/IlRepl.Tests/IlRepl.Tests.csproj --no-build --report-trx --results-directory TestResults
        env:
          # The ILAsm round trips must run on CI, not be skipped when ilasm is missing.
          ILREPL_REQUIRE_ILASM: 1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/

  native-aot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.302'

      - name: Publish, smoke test, and pack for linux-x64
        run: dotnet run --file scripts/Publish-NativeAot.cs -- --rid linux-x64 --package-version 0.0.0-ci

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.302'

      - name: Install the wasm-tools workload
        run: dotnet workload install wasm-tools --skip-manifest-update

      - name: Publish the browser build
        run: dotnet run --file scripts/Publish-Wasm.cs

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: docs/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Build the docs site
        run: pnpm install --frozen-lockfile && pnpm build
        working-directory: docs

      - name: Build the browser tests
        run: dotnet build tests/IlRepl.Docs.Tests/IlRepl.Docs.Tests.csproj

      - name: Install Chromium and WebKit
        run: pwsh tests/IlRepl.Docs.Tests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium webkit

      - name: Test the published runtime in both browsers
        run: dotnet test tests/IlRepl.Docs.Tests/IlRepl.Docs.Tests.csproj --no-build --report-trx --results-directory BrowserTestResults

      - name: Upload browser test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-results
          path: BrowserTestResults/
