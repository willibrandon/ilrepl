name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            artifact: linux-x64
          - name: Linux Arm64
            os: ubuntu-24.04-arm
            artifact: linux-arm64
          - name: Windows x64
            os: windows-latest
            artifact: windows-x64
          - name: Windows Arm64
            os: windows-11-arm
            artifact: windows-arm64
          - name: macOS x64
            os: macos-26-intel
            artifact: macos-x64
          - name: macOS Arm64
            os: macos-26
            artifact: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.302'

      - name: Restore NuGet cache
        id: nuget-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj') }}

      - name: Restore
        run: dotnet restore tests/IlRepl.Tests/IlRepl.Tests.csproj

      - name: Save NuGet cache
        if: steps.nuget-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.nuget/packages
          key: ${{ steps.nuget-cache.outputs.cache-primary-key }}

      - name: Build
        run: dotnet build tests/IlRepl.Tests/IlRepl.Tests.csproj --no-restore

      - name: Test
        run: >-
          dotnet test --project tests/IlRepl.Tests/IlRepl.Tests.csproj --no-build
          --report-trx --results-directory TestResults
        env:
          # The ILAsm round trips must run on CI, not be skipped when ilasm is missing.
          ILREPL_REQUIRE_ILASM: 1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.artifact }}
          path: TestResults/

  native-aot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.302'

      - name: Publish, smoke test, and pack for linux-x64
        run: dotnet run --file scripts/Publish-NativeAot.cs -- --rid linux-x64 --package-version 0.0.0-ci
