name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.302'

      - name: Restore
        run: dotnet restore tests/IlRepl.Tests/IlRepl.Tests.csproj

      - name: Build
        run: dotnet build tests/IlRepl.Tests/IlRepl.Tests.csproj --no-restore

      - name: Test
        run: >-
          dotnet test --project tests/IlRepl.Tests/IlRepl.Tests.csproj --no-build
          --report-trx --results-directory TestResults
        env:
          # The ILAsm round trips must run on CI, not be skipped when ilasm is missing.
          ILREPL_REQUIRE_ILASM: 1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-ubuntu-latest
          path: TestResults/

  platform:
    name: platform (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.302'

      - name: Restore
        run: dotnet restore tests/IlRepl.Tests/IlRepl.Tests.csproj

      - name: Build
        run: dotnet build tests/IlRepl.Tests/IlRepl.Tests.csproj --no-restore

      - name: Test the terminal process
        run: >-
          dotnet test --project tests/IlRepl.Tests/IlRepl.Tests.csproj --no-build
          --filter 'FullyQualifiedName~IlRepl.Tests.EndToEnd'
        env:
          ILREPL_REQUIRE_ILASM: 1

  native-aot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.302'

      - name: Publish, smoke test, and pack for linux-x64
        run: dotnet run --file scripts/Publish-NativeAot.cs -- --rid linux-x64 --package-version 0.0.0-ci
