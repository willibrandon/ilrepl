name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'scripts/Publish-Wasm.cs'
      - 'scripts/Generate-OpcodeReference.cs'
      - 'scripts/Highlight-Cil.cs'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.400'

      - name: Install the wasm-tools workload
        run: dotnet workload install wasm-tools --skip-manifest-update

      - name: Generate the opcode reference
        run: dotnet run --file scripts/Generate-OpcodeReference.cs

      - name: Check the docs' CIL colours are the committed ones
        run: |
          dotnet build samples/Greeter --nologo -v quiet
          dotnet run --file scripts/Highlight-Cil.cs
          if ! git diff --exit-code -- docs/src/generated; then
            echo "::error::the committed colours are stale: run scripts/Highlight-Cil.cs and commit docs/src/generated"
            exit 1
          fi

      - name: Publish the browser build into the site
        run: dotnet run --file scripts/Publish-Wasm.cs

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: docs/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Build the site
        run: pnpm install --frozen-lockfile && pnpm build
        working-directory: docs

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
