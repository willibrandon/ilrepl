name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'tests/IlRepl.Docs.Tests/**'
      - 'scripts/Publish-Wasm.cs'
      - 'scripts/Generate-OpcodeReference.cs'
      - 'scripts/Highlight-Cil.cs'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.302'

      - name: Install the wasm-tools workload
        run: dotnet workload install wasm-tools --skip-manifest-update

      - name: Generate the opcode reference
        run: dotnet run --file scripts/Generate-OpcodeReference.cs

      - name: Check the docs' CIL colours are the committed ones
        run: |
          dotnet build samples/Greeter --nologo -v quiet
          dotnet run --file scripts/Highlight-Cil.cs
          if ! git diff --exit-code -- docs/src/generated; then
            echo "::error::the committed colours are stale: run scripts/Highlight-Cil.cs and commit docs/src/generated"
            exit 1
          fi

      - name: Publish the browser build into the site
        run: dotnet run --file scripts/Publish-Wasm.cs

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: docs/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Build the site
        run: pnpm install --frozen-lockfile && pnpm build
        working-directory: docs

      - uses: actions/upload-artifact@v7
        with:
          name: docs-test-site
          path: docs/dist
          retention-days: 1

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  browser:
    name: browser (${{ matrix.browser.name }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        browser:
          - name: chromium
            filter: 'Name!~webkit'
          - name: webkit
            filter: 'Name~webkit'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.302'

      - uses: actions/download-artifact@v8
        with:
          name: docs-test-site
          path: docs/dist

      - name: Build the docs tests
        run: dotnet build tests/IlRepl.Docs.Tests/IlRepl.Docs.Tests.csproj

      - name: Install Chromium and WebKit
        run: pwsh tests/IlRepl.Docs.Tests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium webkit

      - name: Drive the live session in ${{ matrix.browser.name }}
        run: >-
          dotnet test --project tests/IlRepl.Docs.Tests/IlRepl.Docs.Tests.csproj
          --no-build --filter '${{ matrix.browser.filter }}'

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [build, browser]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
